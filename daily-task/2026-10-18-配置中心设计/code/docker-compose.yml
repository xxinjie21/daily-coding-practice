services:
  mysql:
    image: mysql:8.4
    container_name: config-center-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
    volumes:
      - config_center_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  config_center_data:
